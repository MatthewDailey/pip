<!doctype html>
<!-- Fake "ExampleMail" password-reset page for Pip's phishing scenario. Fictional brand; the form sends nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; connect-src 'none'">
<title>ExampleMail - Sign in to keep your account</title>
<style>
  body { margin: 0; font: 17px/1.45 system-ui, sans-serif; background: #fff; color: #202124; }
  main { padding: 48px 24px; }
  .logo { font: 700 28px/1 system-ui; color: #c5221f; }
  h1 { font: 400 24px/1.3 system-ui; margin: 22px 0 8px; }
  input { width: 100%; box-sizing: border-box; font: inherit; padding: 14px; border: 1.5px solid #c9c9d1; border-radius: 8px; margin-top: 14px; }
  button { margin-top: 26px; float: right; font: 600 17px system-ui; color: #fff; background: #c5221f; border: 0; border-radius: 22px; padding: 12px 26px; }
  #note { clear: both; padding-top: 18px; color: #555; }
</style>
</head>
<body>
<main>
  <div class="logo">ExampleMail</div>
  <h1>Your mailbox is full</h1>
  <p>Your account will be closed today. Verify your account to keep your emails. Click the link and sign in immediately.</p>
  <form onsubmit="event.preventDefault(); document.getElementById('note').textContent = 'Test page: nothing was sent.';">
    <input placeholder="Email or phone" autocomplete="off">
    <input placeholder="Password" type="password" autocomplete="off">
    <button>Verify</button>
  </form>
  <p id="note"></p>
</main>
</body>
</html>
